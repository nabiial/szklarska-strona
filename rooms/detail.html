<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Przekierowanie do galerii</title><script>(function(){function routeSlug(s){s=String(s||'basen').toLowerCase().replace(/ł/g,'l');try{s=s.normalize('NFKD').replace(/[\u0300-\u036f]/g,'')}catch(e){}return s.replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').replace(/-+/g,'-')}var p=new URLSearchParams(location.search),slug=routeSlug(p.get('slug')||'basen'),lang=p.get('lang')||'pl';if(!['pl','en','de'].includes(lang))lang='pl';location.replace('/rooms/'+slug+'/?lang='+lang)})();</script></head><body><p>Przekierowywanie do galerii pomieszczenia…</p></body></html>
